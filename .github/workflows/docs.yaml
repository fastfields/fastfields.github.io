name: Build and deploy landing page

# Publishes the site ROOT (this repo's landing page, the shared stylesheet and
# the theme assets) into the `gh-pages` branch of this same repo, which is what
# GitHub Pages serves.
#
# Why a branch and not actions/deploy-pages: three other repos publish into
# this one site (`/python/` from fastfields, `/dlpack/` from fastfields-dlpack,
# `/lib/` from fastfields-lib). actions/deploy-pages can only deploy to the
# repo it runs in and replaces the whole site each time, so it cannot express
# "several repos, one site". A shared branch can, provided every publisher
# touches only its own subtree -- which is the invariant the rsync below keeps.
#
# `/whl/` is deliberately NOT part of this branch: the `whl` repo is named
# `whl`, so its own project Pages site already serves at
# fastfields.github.io/whl/. It stays independent and is not exposed to any of
# this.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/publish-docs.sh"
      - "tools/check-docs-nav.py"
      - ".github/workflows/docs.yaml"
  # The nav check below gates pull requests too -- that is the point of it, and
  # a menu that only breaks after merge is the situation this is here to end.
  # `build-deploy` stays push-only.
  #
  # The path list is repeated rather than shared with a YAML anchor: GitHub
  # Actions does not support anchors or aliases in workflow files.
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/publish-docs.sh"
      - "tools/check-docs-nav.py"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The top-level documentation menu is duplicated across four repositories --
  # zensical has no include mechanism -- and it drifted until no two sections
  # agreed on it, this landing page being the odd one out with no per-namespace
  # entries at all. This job is the guard, and it has to run HERE, against THIS
  # repo's zensical.toml: a check living in only one repo cannot see another
  # repo's drift, so the same check runs in all four. The canonical list is in
  # DOCS-THEME.md in fastfields/.github.
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # --selftest first: it checks the checker against known-good and
      # known-broken navs, so a check that has quietly stopped failing on
      # anything cannot pass for a working one.
      - run: python3 tools/check-docs-nav.py --selftest
      - run: python3 tools/check-docs-nav.py --check zensical.toml

  build-deploy:
    needs: nav
    # The nav check runs on pull requests; publishing does not.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only this job pushes, so only this job needs write.
    permissions:
      contents: write
    # Stops THIS repo racing itself. It is not the cross-repo guard: concurrency
    # groups are per-repository, so they cannot serialize this workflow against
    # the publishers in the other repos. That is what the push-retry loop below
    # is for. Scoped to this job rather than the workflow so a pull request's
    # nav check does not queue behind a publish.
    concurrency:
      group: publish-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r docs/requirements.txt
      - run: zensical build --clean

      # Jekyll would otherwise swallow any path component starting with an
      # underscore. The root publisher owns this file for the whole site.
      - name: Mark the site as not-Jekyll
        run: touch site/.nojekyll

      # This repo publishes its own site root, so the default GITHUB_TOKEN is
      # enough -- it already has contents: write here. The DOCS_DEPLOY_KEY
      # deploy key is for the three OTHER repos, which cannot use GITHUB_TOKEN
      # because it is scoped to the repo it runs in.
      - name: Publish the site root into gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/publish-docs.sh --auth token --subdir "" --site site
