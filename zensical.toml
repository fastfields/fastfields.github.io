[project]

extra_css = ["stylesheets/extra.css"]

site_name = "fastfields"
site_description = "Fast, stride-aware scalar & vector field operators (CPU/CUDA) with numpy, torch and cupy bindings."
site_author = "Yaël Balbastre"
site_url = "https://fastfields.github.io/"
repo_url = "https://github.com/fastfields/fastfields.github.io"
repo_name = "fastfields/fastfields.github.io"

copyright = """
Copyright &copy; 2026 The fastfields authors
"""

# The org landing page, and the site root. This repo OWNS `/index.html`, the
# shared stylesheet served at /stylesheets/extra.css, and nothing else: the
# three publisher repos each write one subtree below it
# (`/python/`, `/dlpack/`, `/lib/`) and never touch this page. `/whl/` is not
# in this branch at all -- it is the `whl` repo's own Pages site.
#
# The canonical fastfields menu: one entry per installable fastfields
# namespace, plus Home and the wheel index. The eight top-level entries, these
# labels and this order are identical in all four sections (see DOCS-THEME.md
# in the fastfields/.github repo) and tools/check-docs-nav.py fails the build
# if they drift. A section expands the entries it owns into its own pages and
# links the rest absolutely: a relative target keeps in-site navigation native
# (active-page highlight, no full page reload), an absolute one crosses to
# another section's site.
#
# `fastfields.helpers` is not one of the eight: it ships inside the base
# distribution rather than being installed or imported on its own, so it is
# not a listed namespace. Its pages stay published, nested under
# `fastfields.auto` on the /python/ section.
#
# This repo owns exactly one page, so `Home` is the only relative entry here and
# every namespace entry crosses to the section that documents it. The namespace
# order is the order of the Packages table on the landing page; keep the two
# consistent.
nav = [
  {"Home" = "index.md"},
  {"fastfields.auto" = "https://fastfields.github.io/python/auto/"},
  {"fastfields.numpy" = "https://fastfields.github.io/python/numpy/"},
  {"fastfields.torch" = "https://fastfields.github.io/python/torch/"},
  {"fastfields.cupy" = "https://fastfields.github.io/python/cupy/"},
  {"fastfields.dlpack" = "https://fastfields.github.io/dlpack/"},
  {"libfastfields" = "https://fastfields.github.io/lib/"},
  {"Wheel index" = "https://fastfields.github.io/whl/"},
]

[project.theme]

language = "en"

features = [
  "content.code.copy",
  "content.code.select",
  "navigation.indexes",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "fontawesome/solid/spiral"
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
toc_depth = 3
