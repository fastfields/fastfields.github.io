[project]

extra_css = ["stylesheets/extra.css"]

site_name = "fastfields"
site_description = "Fast, stride-aware scalar & vector field operators (CPU/CUDA) with numpy, torch and cupy bindings."
site_author = "Yaël Balbastre"
site_url = "https://fastfields.github.io/"
repo_url = "https://github.com/fastfields/fastfields.github.io"
repo_name = "fastfields/fastfields.github.io"

copyright = """
Copyright &copy; 2026 The fastfields authors
"""

# The org landing page, and the site root. This repo OWNS `/index.html`, the
# shared stylesheet served at /stylesheets/extra.css, and nothing else: the
# three publisher repos each write one subtree below it
# (`/python/`, `/dlpack/`, `/lib/`) and never touch this page. `/whl/` is not
# in this branch at all -- it is the `whl` repo's own Pages site.
#
# Cross-section nav entries are absolute URLs because they cross sites; links
# inside one section stay relative.
nav = [
  {"Home" = "index.md"},
  {"Python packages" = "https://fastfields.github.io/python/"},
  {"Raw DLPack binding" = "https://fastfields.github.io/dlpack/"},
  {"C++/CUDA library" = "https://fastfields.github.io/lib/"},
  {"Wheel index" = "https://fastfields.github.io/whl/"},
]

[project.theme]

language = "en"

features = [
  "content.code.copy",
  "content.code.select",
  "navigation.indexes",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "fontawesome/solid/spiral"
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
toc_depth = 3
